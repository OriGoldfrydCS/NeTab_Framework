[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netab"
version = "0.1.0"
description = "Empirical record proposals with relative compatibility scoring"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ori Goldfryd"}]
dependencies = ["numpy>=1.23", "PyYAML>=6", "torch>=2.1"]

[project.optional-dependencies]
hf = ["transformers>=4.40,<5", "tokenizers>=0.19"]
dev = ["pytest>=7", "hypothesis>=6", "ruff>=0.6", "build>=1"]

[project.scripts]
netab = "netab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
